<style>
:root {
  --bg: #07111f;
  --accent: #63d6ff;
  --accent2: #b35cff;
  --danger: #ff5c86;
  --ok: #62ffc6;
  --warn: #ffd166;
  --ink: #eaf6ff;
  --muted: #91a8bf;
  --rule: rgba(99,214,255,0.18);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Courier New', monospace;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

#game-container {
  position: relative;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #0a1628 0%, #020810 100%);
}

#game-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: 420px;
  max-height: 720px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: auto;
}

/* HUD */
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 8px 12px;
  pointer-events: none;
  z-index: 10;
}
.hud-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px;
}
.hud-item {
  color: var(--ink); font-size: 11px; letter-spacing: 0.05em;
}
.hud-item span { color: var(--accent); font-weight: bold; }
.hp-bar, .shield-bar {
  height: 6px; border-radius: 3px; margin-top: 2px;
  transition: width 0.2s;
}
.hp-bar { background: var(--danger); width: 100%; }
.hp-bar-bg { background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.shield-bar { background: var(--accent); }
.energy-bar { background: var(--accent2); }
.boss-hp-outer {
  height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1);
  overflow: hidden; margin-top: 4px;
}
.boss-hp-inner {
  height: 100%; width: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--danger), var(--warn));
  transition: width 0.3s;
}

/* Skill button */
#skill-btn {
  position: absolute; bottom: 20px; right: 16px;
  width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid var(--accent);
  background: rgba(99,214,255,0.12);
  color: var(--accent);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.08em;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  transition: all 0.2s;
}
#skill-btn:active {
  background: rgba(99,214,255,0.35);
  transform: scale(0.92);
}
#skill-btn.cooldown {
  border-color: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.05);
}
#skill-btn .cd-ring {
  position: absolute; inset: -4px; border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--accent);
  animation: spin 1.5s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Overlay pages */
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 30;
  pointer-events: auto;
  background: rgba(7,17,31,0.88);
  backdrop-filter: blur(4px);
}
.overlay.hidden { display: none; }

.overlay h1 {
  font-size: 2.2rem; color: var(--accent);
  letter-spacing: 0.1em; margin-bottom: 4px;
  text-shadow: 0 0 30px rgba(99,214,255,0.5);
}
.overlay .subtitle {
  color: var(--muted); font-size: 0.82rem;
  letter-spacing: 0.15em; margin-bottom: 24px;
}

.btn {
  display: inline-block;
  padding: 12px 36px;
  margin: 6px;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: rgba(99,214,255,0.1);
  color: var(--accent);
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn:hover { background: rgba(99,214,255,0.25); }
.btn:active { transform: scale(0.96); }
.btn.primary {
  background: var(--accent); color: var(--bg);
  border-color: var(--accent);
  font-weight: bold;
}
.btn.primary:hover { background: #8ae4ff; }

.diff-selector {
  display: flex; gap: 8px; margin: 12px 0 20px;
}
.diff-btn {
  padding: 8px 18px; border: 1px solid var(--rule);
  border-radius: 6px; background: rgba(255,255,255,0.04);
  color: var(--muted); cursor: pointer; font-size: 0.82rem;
  transition: all 0.2s; font-family: inherit;
}
.diff-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(99,214,255,0.12);
}

/* Upgrade cards */
#upgrade-overlay .cards {
  display: flex; flex-direction: column; gap: 10px;
  width: 85%; max-width: 340px;
}
.upgrade-card {
  padding: 14px 16px; border: 1px solid var(--rule);
  border-radius: 12px;
  background: rgba(13,27,46,0.9);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s;
}
.upgrade-card:hover { border-color: var(--accent); background: rgba(99,214,255,0.1); }
.upgrade-card .card-name {
  font-size: 1rem; font-weight: bold; color: var(--accent);
  margin-bottom: 4px;
}
.upgrade-card .card-desc {
  font-size: 0.78rem; color: var(--muted);
}
.upgrade-card .card-tag {
  display: inline-block; margin-top: 6px; padding: 2px 8px;
  border-radius: 999px; border: 1px solid var(--rule);
  font-size: 0.68rem; color: var(--accent2);
  letter-spacing: 0.05em;
}

/* Game over */
#gameover-overlay .stats {
  text-align: center; margin: 16px 0;
}
#gameover-overlay .stat-row {
  display: flex; justify-content: space-between;
  padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  color: var(--muted); font-size: 0.85rem; width: 240px;
}
#gameover-overlay .stat-row .val { color: var(--ink); font-weight: bold; }
#gameover-overlay .new-record {
  color: var(--warn); font-size: 1.1rem;
  animation: blink 0.5s ease-in-out infinite alternate;
}
@keyframes blink { to { opacity: 0.4; } }

/* Pause */
#pause-overlay h2 { color: var(--warn); font-size: 1.6rem; }

/* Warning flash */
.warning-flash {
  position: absolute; inset: 0;
  border: 4px solid var(--danger);
  border-radius: 0;
  pointer-events: none; z-index: 15;
  opacity: 0; transition: opacity 0.15s;
}
.warning-flash.active { opacity: 0.7; }

/* Boss warning */
#boss-warning {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: var(--danger); font-size: 1.5rem; font-weight: bold;
  letter-spacing: 0.2em; z-index: 20; pointer-events: none;
  opacity: 0; transition: opacity 0.2s;
  text-shadow: 0 0 30px rgba(255,92,134,0.8);
}
#boss-warning.active { opacity: 1; animation: bossWarn 0.3s ease-in-out; }
@keyframes bossWarn {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50% { transform: translate(-50%,-50%) scale(1.15); }
}

/* Toast */
#toast {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: var(--ok); font-size: 1rem; font-weight: bold;
  z-index: 25; pointer-events: none;
  opacity: 0; transition: all 0.3s;
}
#toast.show { opacity: 1; transform: translate(-50%,-60%); }
</style>

<script>
// ============================================================
// 星穹空战 — 飞机大战 HTML5 Canvas 游戏
// 严格遵循《星穹空战》技术文档 v1.0
// ============================================================

// ==================== CONFIG ====================
const CONFIG = {
  canvasWidth: 420,
  canvasHeight: 720,
  playerSpeed: 520,
  playerHp: 5,
  baseFireRate: 160,       // ms between shots
  enemySpawnBase: 900,     // ms base spawn interval
  bossAppearTime: 160,     // seconds
  skillCooldown: 12000,    // ms
  pickupMagnetRange: 86,
  invincibleAfterHit: 1200, // ms
  // Object limits
  maxPlayerBullets: 120,
  maxEnemyBullets: 180,
  maxParticles: 220,
  maxEnemies: 40,
};

// ==================== AUDIO (Web Audio API) ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}
function playTone(freq, duration, type = 'square', vol = 0.06) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  } catch(e) {}
}
function sfxShoot() { playTone(800, 0.05, 'square', 0.03); }
function sfxHit() { playTone(200, 0.08, 'sawtooth', 0.05); }
function sfxExplosion() { playTone(60, 0.2, 'sawtooth', 0.08); playTone(40, 0.3, 'triangle', 0.06); }
function sfxPickup() { playTone(1200, 0.06, 'sine', 0.04); playTone(1600, 0.06, 'sine', 0.03); }
function sfxBossWarn() { playTone(100, 0.5, 'sawtooth', 0.1); }
function sfxSkill() { playTone(60, 0.3, 'sawtooth', 0.12); playTone(200, 0.2, 'square', 0.08); }
function sfxBossExplosion() { playTone(30, 0.8, 'sawtooth', 0.15); playTone(50, 0.6, 'triangle', 0.1); }

// ==================== UTILS ====================
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('game-wrapper');
const W = CONFIG.canvasWidth;
const H = CONFIG.canvasHeight;

function resizeCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ==================== DOM REFS ====================
const $ = (id) => document.getElementById(id);
const hud = $('hud');
const scoreVal = $('score-val');
const waveVal = $('wave-val');
const hpBar = $('hp-bar');
const shieldBar = $('shield-bar');
const energyBar = $('energy-bar');
const bossHpOuter = $('boss-hp-outer');
const bossHpInner = $('boss-hp-inner');
const warningFlash = $('warning-flash');
const bossWarning = $('boss-warning');
const toast = $('toast');
const skillBtn = $('skill-btn');
const menuOverlay = $('menu-overlay');
const upgradeOverlay = $('upgrade-overlay');
const pauseOverlay = $('pause-overlay');
const gameoverOverlay = $('gameover-overlay');
const upgradeCards = $('upgrade-cards');
const newRecordEl = $('new-record');
const menuHighscore = $('menu-highscore');

// ==================== GAME STATE ====================
let gameState = {
  status: 'menu', // menu | playing | upgrade | boss | paused | gameover
  score: 0,
  time: 0,
  wave: 1,
  difficulty: 'normal',
  player: null,
  enemies: [],
  bullets: [],
  pickups: [],
  particles: [],
  boss: null,
  upgrades: [],
  // tracking
  kills: 0,
  combo: 0,
  maxCombo: 0,
  lastKillTime: 0,
  shakeAmount: 0,
  flashTimer: 0,
  bossWarningTimer: 0,
  upgradeQueue: false,
  skillCooldownRemaining: 0,
  energy: 0,
  energyNeeded: 100,
  paused: false,
};

// Difficulty multipliers
const DIFFICULTY = {
  easy:   { hpMult: 1.5, spawnMult: 1.3, dmgMult: 0.7, scoreMult: 0.8, label: '新兵' },
  normal: { hpMult: 1.0, spawnMult: 1.0, dmgMult: 1.0, scoreMult: 1.0, label: '王牌' },
  hard:   { hpMult: 0.8, spawnMult: 0.7, dmgMult: 1.4, scoreMult: 1.3, label: '炼狱' },
};

// ==================== PARTICLE SYSTEM ====================
class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
  }
  get alive() { return this.life > 0; }
  draw(ctx) {
    const alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function spawnParticles(x, y, count, color, speed = 200) {
  for (let i = 0; i < count; i++) {
    const angle = rand(0, Math.PI * 2);
    const spd = rand(speed * 0.3, speed);
    gameState.particles.push(new Particle(
      x, y,
      Math.cos(angle) * spd, Math.sin(angle) * spd,
      rand(0.2, 0.6), color, rand(1.5, 4)
    ));
  }
  // Cap particles
  while (gameState.particles.length > CONFIG.maxParticles) {
    gameState.particles.shift();
  }
}

// ==================== BULLET ====================
class Bullet {
  constructor(x, y, vx, vy, damage, owner, radius, style = 'circle') {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.damage = damage;
    this.owner = owner; // 'player' | 'enemy' | 'boss'
    this.radius = radius;
    this.style = style;
    this.penetrating = false;
    this.alive = true;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) {
      this.alive = false;
    }
  }
  draw(ctx) {
    ctx.save();
    if (this.owner === 'player') {
      ctx.shadowColor = '#63d6ff';
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#63d6ff';
    } else {
      ctx.shadowColor = '#ff5c86';
      ctx.shadowBlur = 5;
      ctx.fillStyle = '#ff5c86';
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();
    // Inner glow
    ctx.fillStyle = this.owner === 'player' ? '#fff' : '#ffccd5';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ==================== PICKUP ====================
class Pickup {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type; // 'energy' | 'shield' | 'heal' | 'fireboost'
    this.radius = 10;
    this.ttl = 8; // seconds
    this.magnetRange = CONFIG.pickupMagnetRange;
    this.vy = 30; // slow fall
    this.alive = true;
    this.glowPhase = rand(0, Math.PI * 2);
  }
  update(dt) {
    this.y += this.vy * dt;
    this.ttl -= dt;
    this.glowPhase += dt * 3;
    if (this.ttl <= 0 || this.y > H + 20) this.alive = false;
    // Magnet
    const p = gameState.player;
    if (p && dist(this.x, this.y, p.x, p.y) < this.magnetRange) {
      const angle = Math.atan2(p.y - this.y, p.x - this.x);
      const spd = 300;
      this.x += Math.cos(angle) * spd * dt;
      this.y += Math.sin(angle) * spd * dt;
    }
  }
  draw(ctx) {
    const pulse = 1 + Math.sin(this.glowPhase) * 0.2;
    ctx.save();
    const colors = {
      energy: '#b35cff', shield: '#63d6ff', heal: '#62ffc6', fireboost: '#ffd166'
    };
    const color = colors[this.type] || '#fff';
    ctx.shadowColor = color;
    ctx.shadowBlur = 10 * pulse;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * pulse, 0, Math.PI * 2);
    ctx.fill();
    // Icon
    ctx.fillStyle = '#000';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const icons = { energy: '⚡', shield: '🛡', heal: '+', fireboost: '🔥' };
    ctx.fillText(icons[this.type] || '?', this.x, this.y);
    ctx.restore();
  }
}

// ==================== PLAYER ====================
class Player {
  constructor() {
    this.x = W / 2;
    this.y = H * 0.75;
    this.radius = 14;
    this.hp = CONFIG.playerHp;
    this.maxHp = CONFIG.playerHp;
    this.shield = 0;
    this.maxShield = 3;
    this.speed = CONFIG.playerSpeed;
    this.fireRate = CONFIG.baseFireRate;
    this.fireTimer = 0;
    this.skillCooldown = CONFIG.skillCooldown;
    this.skillTimer = 0;
    this.invincible = 0;
    this.targetX = this.x;
    this.targetY = this.y;
    // Upgrades
    this.doubleShot = false;
    this.penetrating = false;
    this.chainLightning = false;
    this.healNano = false;
    this.phaseDodge = false;
    this.skillType = 'bomb'; // bomb | laser | emp | blackhole
    this.damageBoost = 0;
    this.speedBoost = 0;
  }
  reset() {
    this.x = W / 2; this.y = H * 0.75;
    this.targetX = this.x; this.targetY = this.y;
    this.hp = CONFIG.playerHp;
    this.maxHp = CONFIG.playerHp;
    this.shield = 0;
    this.fireRate = CONFIG.baseFireRate;
    this.fireTimer = 0;
    this.skillTimer = 0;
    this.invincible = 0;
    this.doubleShot = false;
    this.penetrating = false;
    this.chainLightning = false;
    this.healNano = false;
    this.phaseDodge = false;
    this.skillType = 'bomb';
    this.damageBoost = 0;
    this.speedBoost = 0;
  }
  update(dt) {
    // Smooth movement
    const spd = this.speed + this.speedBoost;
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const d = Math.hypot(dx, dy);
    if (d > 1) {
      const moveSpeed = Math.min(spd * dt, d);
      this.x += (dx / d) * moveSpeed;
      this.y += (dy / d) * moveSpeed;
    }
    this.x = clamp(this.x, this.radius, W - this.radius);
    this.y = clamp(this.y, this.radius, H - this.radius);

    // Invincibility
    if (this.invincible > 0) this.invincible -= dt;

    // Auto fire
    this.fireTimer -= dt * 1000;
    if (this.fireTimer <= 0) {
      this.fireTimer = this.fireRate;
      this.shoot();
    }

    // Skill cooldown
    if (this.skillTimer > 0) {
      this.skillTimer -= dt * 1000;
      gameState.skillCooldownRemaining = this.skillTimer;
    } else {
      gameState.skillCooldownRemaining = 0;
    }
  }
  shoot() {
    if (gameState.bullets.length >= CONFIG.maxPlayerBullets) return;
    const dmg = 1 + this.damageBoost;
    const b = new Bullet(this.x, this.y - this.radius, 0, -600, dmg, 'player', 3, 'circle');
    b.penetrating = this.penetrating;
    gameState.bullets.push(b);
    // Double shot
    if (this.doubleShot) {
      const b2 = new Bullet(this.x - 8, this.y - this.radius + 4, 0, -600, dmg, 'player', 3, 'circle');
      b2.penetrating = this.penetrating;
      const b3 = new Bullet(this.x + 8, this.y - this.radius + 4, 0, -600, dmg, 'player', 3, 'circle');
      b3.penetrating = this.penetrating;
      gameState.bullets.push(b2, b3);
    }
    sfxShoot();
  }
  useSkill() {
    if (this.skillTimer > 0) return;
    this.skillTimer = this.skillCooldown;
    sfxSkill();

    switch (this.skillType) {
      case 'bomb':
        // Screen clear: kill all enemy bullets, damage all enemies
        gameState.bullets = gameState.bullets.filter(b => b.owner === 'player');
        gameState.enemies.forEach(e => {
          e.hp -= 3;
          spawnParticles(e.x, e.y, 8, '#ffd166', 250);
        });
        if (gameState.boss) {
          gameState.boss.hp -= 8;
          spawnParticles(gameState.boss.x, gameState.boss.y, 20, '#ffd166', 300);
        }
        spawnParticles(this.x, this.y, 30, '#ffd166', 400);
        gameState.shakeAmount = 8;
        break;
      case 'laser':
        // Orbital laser: vertical beam
        spawnParticles(this.x, this.y, 15, '#63d6ff', 350);
        gameState.enemies.forEach(e => {
          if (Math.abs(e.x - this.x) < 40) {
            e.hp -= 5;
            spawnParticles(e.x, e.y, 6, '#63d6ff', 200);
          }
        });
        if (gameState.boss && Math.abs(gameState.boss.x - this.x) < 60) {
          gameState.boss.hp -= 12;
          spawnParticles(gameState.boss.x, gameState.boss.y, 25, '#63d6ff', 350);
        }
        gameState.shakeAmount = 5;
        break;
      case 'emp':
        // EMP: clear enemy bullets, slow enemies
        gameState.bullets = gameState.bullets.filter(b => b.owner === 'player');
        gameState.enemies.forEach(e => { e.slowTimer = 2.5; });
        gameState.boss.slowTimer = 2.5;
        spawnParticles(this.x, this.y, 40, '#b35cff', 500);
        gameState.shakeAmount = 4;
        break;
      case 'blackhole':
        // Black hole: pull pickups and enemies toward center
        const cx = this.x, cy = this.y - 100;
        gameState.pickups.forEach(p => {
          p.x = lerp(p.x, cx, 0.2);
          p.y = lerp(p.y, cy, 0.2);
        });
        gameState.enemies.forEach(e => {
          e.x = lerp(e.x, cx, 0.08);
          e.y = lerp(e.y, cy, 0.08);
          e.hp -= 1;
        });
        spawnParticles(cx, cy, 25, '#b35cff', 300);
        gameState.shakeAmount = 3;
        break;
    }
    showToast('技能释放!');
  }
  takeDamage(dmg) {
    if (this.invincible > 0) return;
    if (this.phaseDodge && Math.random() < 0.25) {
      spawnParticles(this.x, this.y, 8, '#63d6ff', 150);
      return; // 25% chance to dodge
    }
    if (this.shield > 0) {
      this.shield--;
      spawnParticles(this.x, this.y, 10, '#63d6ff', 200);
      this.invincible = CONFIG.invincibleAfterHit / 1000;
      sfxHit();
      return;
    }
    this.hp -= dmg;
    this.invincible = CONFIG.invincibleAfterHit / 1000;
    gameState.shakeAmount = 6;
    gameState.flashTimer = 0.15;
    spawnParticles(this.x, this.y, 12, '#ff5c86', 200);
    sfxHit();
    if (this.hp <= 0) {
      this.hp = 0;
      spawnParticles(this.x, this.y, 30, '#ff5c86', 400);
      sfxExplosion();
      gameState.status = 'gameover';
      endGame();
    }
  }
  draw(ctx) {
    if (this.invincible > 0 && Math.floor(this.invincible * 20) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    // Engine glow
    ctx.shadowColor = '#63d6ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#63d6ff';
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.arc(0, 4, 6, 0, Math.PI, false);
    ctx.fill();

    // Body
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#eaf6ff';
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(-10, 10);
    ctx.lineTo(-4, 6);
    ctx.lineTo(0, 14);
    ctx.lineTo(4, 6);
    ctx.lineTo(10, 10);
    ctx.closePath();
    ctx.fill();

    // Core
    ctx.shadowColor = '#b35cff';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#b35cff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // Wings
    ctx.shadowColor = '#63d6ff';
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#63d6ff';
    ctx.beginPath();
    ctx.moveTo(-10, 10);
    ctx.lineTo(-18, 16);
    ctx.lineTo(-8, 12);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(10, 10);
    ctx.lineTo(18, 16);
    ctx.lineTo(8, 12);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}

// ==================== ENEMY ====================
class Enemy {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type; // 'small' | 'assault' | 'shield' | 'selfdestruct'
    this.alive = true;
    this.radius = 12;
    this.slowTimer = 0;
    this.shootTimer = 0;
    this.phase = rand(0, Math.PI * 2);

    const diff = DIFFICULTY[gameState.difficulty];
    switch (type) {
      case 'small':
        this.hp = 1; this.speed = rand(100, 180);
        this.score = 10; this.shootInterval = 0; // doesn't shoot
        this.radius = 10;
        break;
      case 'assault':
        this.hp = 2; this.speed = rand(80, 140);
        this.score = 25; this.shootInterval = rand(1.5, 2.5);
        this.radius = 12;
        break;
      case 'shield':
        this.hp = 4; this.speed = rand(50, 90);
        this.score = 50; this.shootInterval = rand(2, 3);
        this.radius = 16;
        break;
      case 'selfdestruct':
        this.hp = 1; this.speed = rand(200, 350);
        this.score = 15; this.shootInterval = 0;
        this.radius = 11;
        break;
    }
    this.hp = Math.ceil(this.hp * diff.hpMult);
    this.score = Math.floor(this.score * diff.scoreMult);
    this.shootTimer = this.shootInterval > 0 ? rand(0, this.shootInterval) : 999;
  }
  update(dt) {
    const spd = this.speed * (this.slowTimer > 0 ? 0.3 : 1);
    this.y += spd * dt;
    if (this.type === 'selfdestruct') {
      // Move toward player
      const p = gameState.player;
      if (p) {
        const angle = Math.atan2(p.y - this.y, p.x - this.x);
        this.x += Math.cos(angle) * spd * 1.5 * dt;
        this.y += Math.sin(angle) * spd * 1.5 * dt;
      }
    }
    if (this.type === 'assault' || this.type === 'shield') {
      this.x += Math.sin(this.phase + gameState.time * 2) * 40 * dt;
    }
    if (this.slowTimer > 0) this.slowTimer -= dt;
    if (this.y > H + 30) this.alive = false;

    // Shoot
    if (this.shootInterval > 0) {
      this.shootTimer -= dt;
      if (this.shootTimer <= 0 && gameState.bullets.length < CONFIG.maxEnemyBullets) {
        this.shootTimer = this.shootInterval;
        const p = gameState.player;
        if (p) {
          const angle = Math.atan2(p.y - this.y, p.x - this.x);
          gameState.bullets.push(new Bullet(
            this.x, this.y + this.radius,
            Math.cos(angle) * 250, Math.sin(angle) * 250,
            1, 'enemy', 4
          ));
        }
      }
    }
  }
  die() {
    this.alive = false;
    spawnParticles(this.x, this.y, this.type === 'shield' ? 15 : 8,
      this.type === 'selfdestruct' ? '#ffd166' : '#ff5c86',
      this.type === 'selfdestruct' ? 300 : 180);
    if (this.type === 'selfdestruct') {
      // Damage nearby
      const p = gameState.player;
      if (p && dist(this.x, this.y, p.x, p.y) < 60) {
        p.takeDamage(1);
      }
    }
    sfxExplosion();
    gameState.score += this.score;
    // Combo
    gameState.combo++;
    gameState.lastKillTime = gameState.time;
    if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
    // Drop
    const dropChance = this.type === 'shield' ? 0.6 : this.type === 'assault' ? 0.25 : 0.12;
    if (Math.random() < dropChance) {
      const types = ['energy', 'energy', 'energy', 'shield', 'heal', 'fireboost'];
      const t = types[randInt(0, types.length - 1)];
      gameState.pickups.push(new Pickup(this.x, this.y, t));
    }
    // Energy
    gameState.energy += this.type === 'shield' ? 15 : this.type === 'assault' ? 8 : 4;
    if (gameState.energy >= gameState.energyNeeded) {
      gameState.energy -= gameState.energyNeeded;
      gameState.energyNeeded = Math.floor(gameState.energyNeeded * 1.15);
      gameState.upgradeQueue = true;
    }
    gameState.kills++;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    const color = this.type === 'shield' ? '#b35cff' :
                  this.type === 'selfdestruct' ? '#ffd166' : '#ff5c86';
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;

    if (this.type === 'shield') {
      // Shield ring
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius + 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = color;
    if (this.type === 'small') {
      ctx.beginPath();
      ctx.moveTo(0, this.radius);
      ctx.lineTo(-this.radius * 0.7, -this.radius * 0.5);
      ctx.lineTo(0, -this.radius * 0.3);
      ctx.lineTo(this.radius * 0.7, -this.radius * 0.5);
      ctx.closePath();
      ctx.fill();
    } else if (this.type === 'selfdestruct') {
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(0, -this.radius);
      ctx.lineTo(-this.radius, this.radius * 0.6);
      ctx.lineTo(this.radius, this.radius * 0.6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

// ==================== BOSS ====================
class Boss {
  constructor() {
    this.x = W / 2;
    this.y = -80;
    this.targetY = 80;
    this.entering = true;
    this.hp = 120;
    this.maxHp = 120;
    this.phase = 0;
    this.radius = 50;
    this.alive = true;
    this.attackTimer = 0;
    this.attackInterval = 1.8;
    this.moveDir = 1;
    this.slowTimer = 0;
    this.warningLasers = []; // { x, timer }
    this.drones = [];
    this.berserkTimer = 0;
    this.flashTimer = 0;
    // Adjust for difficulty
    const diff = DIFFICULTY[gameState.difficulty];
    this.hp = Math.ceil(this.hp * diff.hpMult);
    this.maxHp = this.hp;
  }
  update(dt) {
    // Enter animation
    if (this.entering) {
      this.y = lerp(this.y, this.targetY, 0.03);
      if (Math.abs(this.y - this.targetY) < 2) this.entering = false;
    }

    // Phase check
    const hpRatio = this.hp / this.maxHp;
    if (hpRatio <= 0.15) this.phase = 3;
    else if (hpRatio <= 0.4) this.phase = 2;
    else if (hpRatio <= 0.7) this.phase = 1;
    else this.phase = 0;

    // Movement
    if (!this.entering) {
      const spd = (this.slowTimer > 0 ? 0.3 : 1) * (this.phase >= 3 ? 180 : 80);
      this.x += this.moveDir * spd * dt;
      if (this.x > W - 60) this.moveDir = -1;
      if (this.x < 60) this.moveDir = 1;
    }

    if (this.slowTimer > 0) this.slowTimer -= dt;
    if (this.flashTimer > 0) this.flashTimer -= dt;

    // Attacks
    this.attackTimer -= dt;
    if (this.attackTimer <= 0 && !this.entering) {
      this.doAttack();
      this.attackInterval = this.phase >= 3 ? 0.6 : this.phase >= 1 ? 1.2 : 1.8;
      this.attackTimer = this.attackInterval;
    }

    // Update warning lasers
    for (const w of this.warningLasers) w.timer -= dt;
    this.warningLasers = this.warningLasers.filter(w => w.timer > -0.5);

    // Update drones
    for (const d of this.drones) {
      d.y += d.speed * dt;
      d.shootTimer -= dt;
      if (d.shootTimer <= 0 && gameState.bullets.length < CONFIG.maxEnemyBullets) {
        d.shootTimer = 1.5;
        const p = gameState.player;
        if (p) {
          const angle = Math.atan2(p.y - d.y, p.x - d.x);
          gameState.bullets.push(new Bullet(d.x, d.y, Math.cos(angle) * 200, Math.sin(angle) * 200, 1, 'enemy', 3));
        }
      }
    }
    this.drones = this.drones.filter(d => d.y < H + 30 && d.hp > 0);

    // Berserk timer
    if (this.phase >= 3) {
      this.berserkTimer -= dt;
      if (this.berserkTimer <= 0) {
        this.berserkTimer = 0.3;
        this.doAttack();
      }
    }
  }
  doAttack() {
    switch (this.phase) {
      case 0: this.attackRingSpread(8, 150, 4); break;
      case 1:
        if (Math.random() < 0.5) this.attackRingSpread(12, 180, 5);
        else this.attackQuantumLaser();
        break;
      case 2:
        const r = Math.random();
        if (r < 0.35) this.attackRingSpread(14, 200, 5);
        else if (r < 0.7) this.attackQuantumLaser();
        else this.attackDrones();
        break;
      case 3:
        if (Math.random() < 0.5) this.attackRingSpread(16, 280, 6);
        else this.attackQuantumLaser();
        break;
    }
  }
  attackRingSpread(count, speed, dmg) {
    const angleStep = (Math.PI * 2) / count;
    const offset = rand(0, angleStep);
    for (let i = 0; i < count; i++) {
      const angle = offset + angleStep * i;
      gameState.bullets.push(new Bullet(
        this.x, this.y,
        Math.cos(angle) * speed, Math.sin(angle) * speed,
        dmg, 'enemy', 4
      ));
    }
  }
  attackQuantumLaser() {
    // Warning line at player position
    const p = gameState.player;
    if (p) {
      this.warningLasers.push({ x: p.x, timer: 0.8 });
    }
  }
  attackDrones() {
    for (let side = -1; side <= 1; side += 2) {
      this.drones.push({
        x: this.x + side * 80,
        y: this.y + 20,
        hp: 3,
        speed: 100,
        shootTimer: 1,
        radius: 10,
      });
    }
  }
  takeDamage(dmg) {
    this.hp -= dmg;
    this.flashTimer = 0.08;
    spawnParticles(this.x + rand(-30, 30), this.y + rand(-20, 20), 5, '#fff', 120);
    sfxHit();
    if (this.hp <= 0) {
      this.hp = 0;
      this.alive = false;
      spawnParticles(this.x, this.y, 60, '#ffd166', 500);
      spawnParticles(this.x, this.y, 40, '#ff5c86', 400);
      sfxBossExplosion();
      gameState.shakeAmount = 15;
      gameState.flashTimer = 0.3;
      gameState.score += 500;
      showToast('BOSS 击破!');
      // End game victory
      setTimeout(() => {
        if (gameState.status === 'boss') {
          gameState.status = 'gameover';
          gameState.score += Math.floor(gameState.time * 2);
          endGame();
        }
      }, 2000);
    }
  }
  draw(ctx) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    // Boss body
    const bodyColor = this.flashTimer > 0 ? '#fff' : '#cc3355';
    ctx.shadowColor = bodyColor;
    ctx.shadowBlur = 15;

    // Main hull
    ctx.fillStyle = '#1a0a10';
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -40);
    ctx.lineTo(-45, -10);
    ctx.lineTo(-40, 15);
    ctx.lineTo(-20, 20);
    ctx.lineTo(0, 5);
    ctx.lineTo(20, 20);
    ctx.lineTo(40, 15);
    ctx.lineTo(45, -10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Core
    ctx.fillStyle = this.phase >= 3 ? '#ff2244' : this.phase >= 1 ? '#ff5c86' : '#cc3355';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(0, -5, 14, 0, Math.PI * 2);
    ctx.fill();

    // Phase indicator
    if (this.phase >= 2) {
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, -5, 20, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Wing details
    ctx.fillStyle = '#330a15';
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = 1;
    ctx.shadowBlur = 4;
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(s * 30, -5);
      ctx.lineTo(s * 50, -15);
      ctx.lineTo(s * 48, 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });

    ctx.restore();

    // Draw drones
    for (const d of this.drones) {
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.fillStyle = '#ff5c86';
      ctx.shadowColor = '#ff5c86';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(0, -d.radius);
      ctx.lineTo(-d.radius * 0.7, d.radius * 0.5);
      ctx.lineTo(d.radius * 0.7, d.radius * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Draw warning lasers
    for (const w of this.warningLasers) {
      const alpha = w.timer > 0 ? 0.5 : Math.max(0, 1 + w.timer / 0.5);
      ctx.save();
      ctx.globalAlpha = alpha;
      if (w.timer > 0) {
        ctx.strokeStyle = '#ff5c86';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]);
      } else {
        ctx.strokeStyle = '#ff2244';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#ff2244';
        ctx.shadowBlur = 15;
      }
      ctx.beginPath();
      ctx.moveTo(w.x, 0);
      ctx.lineTo(w.x, H);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
}

// ==================== SPAWNER ====================
let spawnTimer = 0;
function updateSpawner(dt) {
  if (gameState.status !== 'playing') return;
  const diff = DIFFICULTY[gameState.difficulty];
  const baseInterval = CONFIG.enemySpawnBase * diff.spawnMult;
  // Speed up over time
  const interval = Math.max(300, baseInterval - gameState.time * 2);
  spawnTimer -= dt * 1000;
  if (spawnTimer <= 0) {
    spawnTimer = interval;
    if (gameState.enemies.length < CONFIG.maxEnemies) {
      spawnEnemy();
    }
  }
  // Boss spawn
  if (gameState.time >= CONFIG.bossAppearTime && gameState.status === 'playing') {
    spawnBoss();
  }
}

function spawnEnemy() {
  const x = rand(30, W - 30);
  const t = gameState.time;
  let type = 'small';
  if (t > 30) {
    const r = Math.random();
    if (t > 90 && r < 0.15) type = 'shield';
    else if (r < 0.35) type = 'assault';
    else if (r < 0.5) type = 'selfdestruct';
  }
  gameState.enemies.push(new Enemy(x, -20, type));
}

function spawnBoss() {
  gameState.status = 'boss';
  gameState.boss = new Boss();
  bossHpOuter.classList.remove('hidden');
  bossWarning.classList.add('active');
  sfxBossWarn();
  gameState.shakeAmount = 4;
  gameState.flashTimer = 0.2;
  setTimeout(() => bossWarning.classList.remove('active'), 1500);
}

// ==================== COLLISION ====================
function checkCollisions() {
  const p = gameState.player;
  if (!p || p.hp <= 0) return;

  // Player bullets vs enemies
  for (const b of gameState.bullets) {
    if (!b.alive || b.owner !== 'player') continue;
    for (const e of gameState.enemies) {
      if (!e.alive) continue;
      if (dist(b.x, b.y, e.x, e.y) < b.radius + e.radius) {
        e.hp -= b.damage;
        if (!b.penetrating) b.alive = false;
        spawnParticles(b.x, b.y, 2, '#63d6ff', 80);
        if (e.hp <= 0) e.die();
        // Chain lightning
        if (p.chainLightning && b.alive) {
          let nearest = null;
          let nearestDist = 120;
          for (const e2 of gameState.enemies) {
            if (e2 === e || !e2.alive) continue;
            const d = dist(e.x, e.y, e2.x, e2.y);
            if (d < nearestDist) { nearest = e2; nearestDist = d; }
          }
          if (nearest) {
            nearest.hp -= 1;
            spawnParticles(nearest.x, nearest.y, 4, '#b35cff', 100);
            if (nearest.hp <= 0) nearest.die();
          }
          b.alive = false;
        }
        break;
      }
    }
    // Player bullets vs boss
    const boss = gameState.boss;
    if (boss && boss.alive) {
      if (dist(b.x, b.y, boss.x, boss.y) < b.radius + boss.radius) {
        boss.takeDamage(b.damage);
        if (!b.penetrating) b.alive = false;
        // Also check drone hits
      }
      for (const d of boss.drones) {
        if (d.hp <= 0) continue;
        if (dist(b.x, b.y, d.x, d.y) < b.radius + d.radius) {
          d.hp -= b.damage;
          if (!b.penetrating) b.alive = false;
          spawnParticles(b.x, b.y, 2, '#ffd166', 80);
          if (d.hp <= 0) spawnParticles(d.x, d.y, 8, '#ffd166', 150);
          break;
        }
      }
    }
  }

  // Enemy bullets vs player
  for (const b of gameState.bullets) {
    if (!b.alive || b.owner === 'player') continue;
    if (dist(b.x, b.y, p.x, p.y) < b.radius + p.radius) {
      b.alive = false;
      p.takeDamage(b.damage);
    }
  }

  // Warning lasers vs player
  const boss = gameState.boss;
  if (boss && boss.alive) {
    for (const w of boss.warningLasers) {
      if (w.timer <= 0 && w.timer > -0.15 && Math.abs(p.x - w.x) < 25) {
        p.takeDamage(2);
      }
    }
  }

  // Enemies vs player (body collision)
  for (const e of gameState.enemies) {
    if (!e.alive) continue;
    if (dist(p.x, p.y, e.x, e.y) < p.radius + e.radius) {
      e.hp -= 2;
      p.takeDamage(1);
      if (e.hp <= 0) e.die();
    }
  }

  // Pickups vs player
  for (const pk of gameState.pickups) {
    if (!pk.alive) continue;
    if (dist(p.x, p.y, pk.x, pk.y) < p.radius + pk.radius + 5) {
      pk.alive = false;
      applyPickup(pk);
    }
  }
}

function applyPickup(pk) {
  const p = gameState.player;
  sfxPickup();
  switch (pk.type) {
    case 'energy':
      gameState.energy += 15;
      if (gameState.energy >= gameState.energyNeeded) {
        gameState.energy -= gameState.energyNeeded;
        gameState.energyNeeded = Math.floor(gameState.energyNeeded * 1.15);
        gameState.upgradeQueue = true;
      }
      break;
    case 'shield':
      p.shield = Math.min(p.shield + 1, p.maxShield);
      break;
    case 'heal':
      p.hp = Math.min(p.hp + 1, p.maxHp);
      break;
    case 'fireboost':
      p.damageBoost += 1;
      setTimeout(() => { if (p.damageBoost > 0) p.damageBoost--; }, 8000);
      break;
  }
  spawnParticles(pk.x, pk.y, 6, '#fff', 100);
}

// ==================== STARFIELD BACKGROUND ====================
const stars = [];
for (let i = 0; i < 80; i++) {
  stars.push({
    x: rand(0, W), y: rand(0, H),
    speed: rand(20, 80), size: rand(0.5, 2),
    brightness: rand(0.3, 1)
  });
}

function drawBackground(ctx) {
  // Deep space gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#020818');
  grad.addColorStop(0.5, '#071120');
  grad.addColorStop(1, '#0a1428');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = 'rgba(99,214,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Stars
  for (const s of stars) {
    s.y += s.speed * 0.016;
    if (s.y > H + 5) { s.y = -5; s.x = rand(0, W); }
    ctx.fillStyle = `rgba(255,255,255,${s.brightness * 0.7})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ==================== GAME LOOP ====================
let lastTime = 0;
let gameRunning = false;

function gameLoop(timestamp) {
  if (!gameRunning) return;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

function update(dt) {
  if (gameState.status === 'playing' || gameState.status === 'boss') {
    gameState.time += dt;
    // Combo decay
    if (gameState.time - gameState.lastKillTime > 1.5) gameState.combo = 0;

    // Player
    if (gameState.player) gameState.player.update(dt);

    // Enemies
    for (const e of gameState.enemies) e.update(dt);
    gameState.enemies = gameState.enemies.filter(e => e.alive);

    // Bullets
    for (const b of gameState.bullets) b.update(dt);
    gameState.bullets = gameState.bullets.filter(b => b.alive);

    // Pickups
    for (const pk of gameState.pickups) pk.update(dt);
    gameState.pickups = gameState.pickups.filter(p => p.alive);

    // Particles
    for (const pt of gameState.particles) pt.update(dt);
    gameState.particles = gameState.particles.filter(p => p.alive);

    // Boss
    if (gameState.boss && gameState.boss.alive) gameState.boss.update(dt);

    // Spawner
    updateSpawner(dt);

    // Collisions
    checkCollisions();

    // Screen shake decay
    if (gameState.shakeAmount > 0) gameState.shakeAmount *= 0.9;
    if (gameState.shakeAmount < 0.1) gameState.shakeAmount = 0;

    // Flash timer
    if (gameState.flashTimer > 0) gameState.flashTimer -= dt;

    // Upgrade check
    if (gameState.upgradeQueue && gameState.status === 'playing') {
      gameState.upgradeQueue = false;
      showUpgrade();
    }

    // Update HUD
    updateHUD();
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  // Screen shake
  if (gameState.shakeAmount > 0) {
    ctx.translate(
      rand(-gameState.shakeAmount, gameState.shakeAmount),
      rand(-gameState.shakeAmount, gameState.shakeAmount)
    );
  }

  drawBackground(ctx);

  // Pickups
  for (const pk of gameState.pickups) pk.draw(ctx);

  // Particles
  for (const pt of gameState.particles) pt.draw(ctx);

  // Bullets
  for (const b of gameState.bullets) b.draw(ctx);

  // Enemies
  for (const e of gameState.enemies) e.draw(ctx);

  // Boss
  if (gameState.boss && gameState.boss.alive) gameState.boss.draw(ctx);

  // Player
  if (gameState.player && gameState.player.hp > 0) gameState.player.draw(ctx);

  ctx.restore();

  // Flash overlay
  if (gameState.flashTimer > 0) {
    ctx.fillStyle = `rgba(255,50,80,${gameState.flashTimer * 2})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function updateHUD() {
  const p = gameState.player;
  if (!p) return;
  scoreVal.textContent = gameState.score;
  waveVal.textContent = Math.floor(gameState.time / 30) + 1;
  hpBar.style.width = (p.hp / p.maxHp * 100) + '%';
  shieldBar.style.width = (p.shield / p.maxShield * 100) + '%';
  energyBar.style.width = (gameState.energy / gameState.energyNeeded * 100) + '%';

  // Boss HP
  if (gameState.boss && gameState.boss.alive) {
    bossHpOuter.classList.remove('hidden');
    bossHpInner.style.width = (gameState.boss.hp / gameState.boss.maxHp * 100) + '%';
  } else {
    bossHpOuter.classList.add('hidden');
  }

  // Skill button
  if (gameState.skillCooldownRemaining > 0) {
    skillBtn.classList.add('cooldown');
    skillBtn.textContent = (gameState.skillCooldownRemaining / 1000).toFixed(1) + 's';
  } else {
    skillBtn.classList.remove('cooldown');
    skillBtn.textContent = 'SKILL';
  }
}

// ==================== UPGRADE SYSTEM ====================
const ALL_UPGRADES = [
  // Fire
  { id: 'doubleShot', name: '双重射击', desc: '额外发射两条平行子弹', tag: '火力', type: 'fire' },
  { id: 'penetrating', name: '穿透弹', desc: '子弹可穿透 1 个敌人', tag: '火力', type: 'fire' },
  { id: 'chainLightning', name: '电磁链', desc: '命中后弹跳到附近敌人', tag: '火力', type: 'fire' },
  { id: 'damageBoost', name: '能量增幅', desc: '子弹伤害永久 +1', tag: '火力', type: 'fire' },
  { id: 'fireRate', name: '速射模组', desc: '射击速度提升 25%', tag: '火力', type: 'fire' },
  // Survival
  { id: 'shieldUp', name: '能量护盾', desc: '获得 1 层可抵挡伤害的护盾', tag: '生存', type: 'survival' },
  { id: 'healNano', name: '维修纳米', desc: '拾取能量时少量回血', tag: '生存', type: 'survival' },
  { id: 'phaseDodge', name: '相位闪避', desc: '25% 概率闪避伤害', tag: '生存', type: 'survival' },
  { id: 'maxHp', name: '装甲强化', desc: '生命上限 +1 并回复', tag: '生存', type: 'survival' },
  // Skill
  { id: 'skillLaser', name: '轨道激光', desc: '主动技能变为纵向高伤害激光', tag: '技能', type: 'skill' },
  { id: 'skillEmp', name: 'EMP 冲击', desc: '清除敌方子弹并减速敌人', tag: '技能', type: 'skill' },
  { id: 'skillBlackhole', name: '黑洞牵引', desc: '吸附道具并聚拢小怪', tag: '技能', type: 'skill' },
  { id: 'skillCooldown', name: '冷却缩减', desc: '技能冷却时间减少 30%', tag: '技能', type: 'skill' },
];

function getRandomUpgrades(count) {
  const available = ALL_UPGRADES.filter(u => {
    if (u.id === 'doubleShot' && gameState.player.doubleShot) return false;
    if (u.id === 'penetrating' && gameState.player.penetrating) return false;
    if (u.id === 'chainLightning' && gameState.player.chainLightning) return false;
    if (u.id === 'healNano' && gameState.player.healNano) return false;
    if (u.id === 'phaseDodge' && gameState.player.phaseDodge) return false;
    return true;
  });
  const shuffled = available.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

function showUpgrade() {
  gameState.status = 'upgrade';
  upgradeOverlay.classList.remove('hidden');
  const upgrades = getRandomUpgrades(3);
  upgradeCards.innerHTML = '';
  upgrades.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    card.innerHTML = `
      <div class="card-name">${u.name}</div>
      <div class="card-desc">${u.desc}</div>
      <div class="card-tag">${u.tag}</div>
    `;
    card.addEventListener('click', () => applyUpgrade(u));
    upgradeCards.appendChild(card);
  });
}

function applyUpgrade(upgrade) {
  const p = gameState.player;
  gameState.upgrades.push(upgrade.id);
  switch (upgrade.id) {
    case 'doubleShot': p.doubleShot = true; break;
    case 'penetrating': p.penetrating = true; break;
    case 'chainLightning': p.chainLightning = true; break;
    case 'damageBoost': p.damageBoost += 1; break;
    case 'fireRate': p.fireRate = Math.max(60, p.fireRate * 0.75); break;
    case 'shieldUp': p.shield = Math.min(p.shield + 1, p.maxShield); break;
    case 'healNano': p.healNano = true; break;
    case 'phaseDodge': p.phaseDodge = true; break;
    case 'maxHp': p.maxHp += 1; p.hp = Math.min(p.hp + 1, p.maxHp); break;
    case 'skillLaser': p.skillType = 'laser'; break;
    case 'skillEmp': p.skillType = 'emp'; break;
    case 'skillBlackhole': p.skillType = 'blackhole'; break;
    case 'skillCooldown': p.skillCooldown = Math.max(3000, p.skillCooldown * 0.7); break;
  }
  upgradeOverlay.classList.add('hidden');
  gameState.status = 'playing';
  showToast(upgrade.name + ' 已装备!');
}

// ==================== INPUT ====================
let inputMode = 'mouse'; // 'mouse' | 'touch' | 'keys'
const keys = {};

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY,
  };
}

// Mouse
canvas.addEventListener('mousemove', (e) => {
  if (gameState.status !== 'playing' && gameState.status !== 'boss') return;
  inputMode = 'mouse';
  const pos = getCanvasPos(e);
  if (gameState.player) {
    gameState.player.targetX = pos.x;
    gameState.player.targetY = pos.y;
  }
});

// Touch
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameState.status !== 'playing' && gameState.status !== 'boss') return;
  inputMode = 'touch';
  const pos = getCanvasPos(e.touches[0]);
  if (gameState.player) {
    gameState.player.targetX = pos.x;
    gameState.player.targetY = pos.y;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gameState.status !== 'playing' && gameState.status !== 'boss') return;
  const pos = getCanvasPos(e.touches[0]);
  if (gameState.player) {
    gameState.player.targetX = pos.x;
    gameState.player.targetY = pos.y;
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { /* keep position */ });

// Keyboard
window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if ((gameState.status === 'playing' || gameState.status === 'boss') && gameState.player) {
      gameState.player.useSkill();
    }
  }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    togglePause();
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

function updateKeyboardInput(dt) {
  if (inputMode === 'touch' || inputMode === 'mouse') return;
  const p = gameState.player;
  if (!p) return;
  const spd = (p.speed + p.speedBoost) * dt;
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx = -1; inputMode = 'keys'; }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx = 1; inputMode = 'keys'; }
  if (keys['ArrowUp'] || keys['w'] || keys['W']) { dy = -1; inputMode = 'keys'; }
  if (keys['ArrowDown'] || keys['s'] || keys['S']) { dy = 1; inputMode = 'keys'; }
  if (dx !== 0 || dy !== 0) {
    const mag = Math.hypot(dx, dy);
    p.targetX = p.x + (dx / mag) * spd * 3;
    p.targetY = p.y + (dy / mag) * spd * 3;
    p.targetX = clamp(p.targetX, p.radius, W - p.radius);
    p.targetY = clamp(p.targetY, p.radius, H - p.radius);
  }
}
